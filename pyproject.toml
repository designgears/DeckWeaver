[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "deckweaver"
version = "0.6.1"
description = "Stream Deck plugin for PipeWeaver audio control"
readme = "README.md"
license = { text = "GPL-2.0-only" }
authors = [{ name = "DesignGears" }]
requires-python = ">=3.11"

[tool.maturin]
manifest-path = "crates/deckweaver-py/Cargo.toml"
module-name = "deckweaver._core"
