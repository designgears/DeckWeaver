[workspace]
resolver = "2"
members = [
    "crates/deckweaver-core",
    "crates/deckweaver-py",
    "crates/deckweaver-opendeck",
]

[workspace.package]
version = "0.7.1"
edition = "2024"
authors = ["DesignGears"]
license = "GPL-2.0-only"
repository = "https://github.com/designgears/DeckWeaver"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pipeweaver-ipc = { git = "https://github.com/pipeweaver/pipeweaver" }
pipeweaver-profile = { git = "https://github.com/pipeweaver/pipeweaver" }
pipeweaver-shared = { git = "https://github.com/pipeweaver/pipeweaver" }
tiny-skia = "0.11"
resvg = "0.45"
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
parking_lot = "0.12"
log = "0.4"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
