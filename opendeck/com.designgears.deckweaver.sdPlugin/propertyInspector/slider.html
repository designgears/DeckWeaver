<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DeckWeaver Volume</title>
  <link rel="stylesheet" href="pi.css" />
  <script src="pi.js"></script>
</head>
<body class="pi">
  <div id="status" class="status">Connecting…</div>

  <div id="iconPickerMount"></div>

  <section class="section">
    <label class="field-label" for="device">PipeWeaver device</label>
    <select id="device"></select>
  </section>

  <section class="section">
    <label class="field-label" for="volumeStep">Volume step</label>
    <input id="volumeStep" type="number" min="-20" max="20" />
    <p class="field-hint">Positive = top half (volume up), negative = bottom half (volume down). Hold the key to keep stepping.</p>
  </section>

  <section class="section">
    <label class="field-label" for="holdRepeatMs">Hold repeat speed (ms)</label>
    <input id="holdRepeatMs" type="number" min="50" max="1000" step="50" />
    <p class="field-hint">Time between steps while the key is held. Lower is faster. Default 400.</p>
  </section>

  <section class="section">
    <label class="field-label" for="orientation">Orientation</label>
    <select id="orientation">
      <option value="vertical">Vertical</option>
      <option value="horizontal">Horizontal</option>
    </select>
  </section>

  <section class="section">
    <label class="checkbox-row" for="metersEnabled">
      <input id="metersEnabled" type="checkbox" />
      <span>Show meters</span>
    </label>
  </section>

  <footer class="pi-footer">
    <button id="refresh" type="button" class="btn-secondary">Refresh devices</button>
  </footer>

  <script>
    initActionInspector({
      defaultVolumeStep: 5,
      minVolumeStep: -20,
      maxVolumeStep: 20,
    });
  </script>
</body>
</html>
