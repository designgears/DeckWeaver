<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DeckWeaver App Volume</title>
  <link rel="stylesheet" href="pi.css" />
  <script src="pi.js"></script>
</head>
<body class="pi">
  <div id="status" class="status">Connecting…</div>

  <div id="iconPickerMount"></div>

  <section class="section">
    <label class="field-label" for="app">Application</label>
    <select id="app"></select>
    <p class="field-hint">Only apps currently playing audio are listed.</p>
  </section>

  <section class="section">
    <label class="field-label" for="volumeStep">Volume step</label>
    <input id="volumeStep" type="number" min="-20" max="20" />
    <p class="field-hint">Positive raises the volume, negative lowers it; hold the key to keep stepping. Set to 0 to toggle mute on press.</p>
  </section>

  <section class="section">
    <label class="field-label" for="holdRepeatMs">Hold repeat speed (ms)</label>
    <input id="holdRepeatMs" type="number" min="50" max="1000" step="50" />
    <p class="field-hint">Time between steps while the key is held. Lower is faster. Default 400.</p>
  </section>

  <section class="section">
    <label class="checkbox-row" for="metersEnabled">
      <input id="metersEnabled" type="checkbox" />
      <span>Show meters</span>
    </label>
  </section>

  <footer class="pi-footer">
    <button id="refresh" type="button" class="btn-secondary">Refresh apps</button>
  </footer>

  <script>
    initAppInspector({
      defaultVolumeStep: 5,
      minVolumeStep: -20,
      maxVolumeStep: 20,
    });
  </script>
</body>
</html>
