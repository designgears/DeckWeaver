<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DeckWeaver</title>
  <link rel="stylesheet" href="pi.css" />
  <script src="pi.js"></script>
</head>
<body class="pi">
  <div id="status" class="status">Connecting…</div>

  <div id="iconPickerMount"></div>

  <section class="section">
    <label class="field-label" for="device">PipeWeaver device</label>
    <select id="device"></select>
  </section>

  <section class="section row">
    <div>
      <label class="field-label" for="volumeStep">Volume step</label>
      <input id="volumeStep" type="number" min="1" max="20" />
    </div>
    <div>
      <label class="field-label" for="sourceMix">Source mix</label>
      <select id="sourceMix">
        <option value="A">Mix A</option>
        <option value="B">Mix B</option>
      </select>
    </div>
  </section>

  <section class="section">
    <label class="checkbox-row" for="metersEnabled">
      <input id="metersEnabled" type="checkbox" />
      <span>Show meters</span>
    </label>
    <label class="checkbox-row" for="showVolume" data-knob-only>
      <input id="showVolume" type="checkbox" />
      <span>Show volume percentage</span>
    </label>
  </section>

  <footer class="pi-footer">
    <button id="refresh" type="button" class="btn-secondary">Refresh devices</button>
  </footer>

  <script>
    initActionInspector({
      signedVolumeStep: false,
      showSourceMix: true,
      defaultVolumeStep: 5,
      minVolumeStep: 1,
      maxVolumeStep: 20,
    });
  </script>
</body>
</html>
